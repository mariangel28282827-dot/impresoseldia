  <rect x="100" y="310" width="312" height="44" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="6"/>
  <circle cx="140" cy="332" r="10" fill="#38bdf8"/>
  <circle cx="216" cy="332" r="10" fill="#38bdf8"/>
  <circle cx="296" cy="332" r="10" fill="#38bdf8"/>
  <circle cx="372" cy="332" r="10" fill="#38bdf8"/>
  <!-- UV Polymerized Beam -->
  <polygon points="176,206 336,206 376,306 136,306" fill="url(#glow)" opacity="0.45"/>
  <!-- Quality Cross-Hatch 100% checkmark -->
  <circle cx="360" cy="380" r="54" fill="#059669" stroke="#10b981" stroke-width="6"/>
